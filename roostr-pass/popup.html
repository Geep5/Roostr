<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Roostr Pass</title>
    <style>
      body {
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 12px 14px;
        min-width: 320px;
        color: #1c1c1e;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .login {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid #eee;
      }
      .login:first-of-type {
        border-top: none;
      }
      .name {
        font-weight: 600;
      }
      .sub {
        color: #6e6e73;
        font-size: 12px;
        margin-top: 2px;
      }
      .state {
        white-space: nowrap;
        font-size: 12px;
      }
      .ok {
        color: #1a7f37;
      }
      .wait {
        color: #6e6e73;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid #d97706;
        background: #d97706;
        color: white;
        cursor: pointer;
        white-space: nowrap;
      }
      .problem {
        color: #b42318;
        margin-bottom: 8px;
      }
      code {
        font-size: 11px;
        background: #f2f2f7;
        padding: 2px 4px;
        border-radius: 4px;
        user-select: all;
      }
      .empty {
        color: #6e6e73;
      }
    </style>
  </head>
  <body>
    <h1>Roostr Pass</h1>
    <div id="out" class="empty">Checking…</div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
