syntax = "proto3";
package glon;

// ═══════════════════════════════════════════════════════════════════
// Glon OS — Protocol
//
// The protocol has three layers:
//
//   1. Change DAG — every mutation is a content-addressed protobuf
//      message forming a DAG. This is the source of truth.
//
//   2. Sync Protocol — typed messages for exchanging DAG state
//      between peers. A peer is any actor holding a copy of an
//      object's change history.
//
//   3. Computed State — derived by replaying the DAG. Never stored
//      as truth. Any peer can recompute it from changes alone.
//
// The transport is Rivet actors over HTTP. The protocol does not
// depend on Rivet — it would work over any transport that can
// deliver protobuf bytes between addressed endpoints.
// ═══════════════════════════════════════════════════════════════════


// ── Layer 1: The Change DAG ──────────────────────────────────────
//
// A Change is a single mutation in an object's history.
// Content-addressed: id = SHA-256(encode(change with id zeroed)).
// Parent edges form the DAG. Multiple parents = merge of concurrent
// edits. No parents = genesis (object creation).
//
// Changes are immutable once created. The protobuf bytes on disk
// ARE the change. There is no wrapper, no metadata file, no index
// entry that supersedes the bytes.


message Change {
  bytes  id         = 1;    // SHA-256 content address
  string object_id  = 2;    // stable object identifier
  repeated bytes parent_ids = 3;  // DAG edges to parent changes
  repeated Operation ops    = 4;  // mutations in this change
  int64  timestamp  = 5;    // unix ms
  string author     = 6;    // author/device identifier

  // Snapshots are never source of truth — they are a replay optimization.
  // The DAG of ops remains canonical; snapshots just let us skip prefix replay.
  ObjectSnapshot snapshot = 7;  // optional state checkpoint (speeds up replay)

  // Field 22 was AuthExtension (chain-mode); removed in the chain-mode strip.
  reserved 22;
  reserved "auth_extension";
}

// Ed25519 signature container. Used by transport-level signing
// (e.g. /peer-chat envelopes). Not part of the DAG.
message Signature {
  bytes  pubkey    = 1;    // 32-byte Ed25519 public key
  bytes  signature = 2;    // 64-byte Ed25519 signature
}

// Atomic mutation within a Change. Applied in order during replay.
message Operation {
  oneof op {
    ObjectCreate  object_create  = 1;
    ObjectDelete  object_delete  = 2;
    FieldSet      field_set      = 3;
    FieldDelete   field_delete   = 4;
    BlockAdd      block_add      = 6;
    BlockRemove   block_remove   = 7;
    BlockUpdate   block_update   = 8;
    BlockMove     block_move     = 9;
    BlockSetAlign      block_set_align      = 10;
    BlockSetBackground block_set_background = 11;
  }
}

// Set a block's horizontal alignment (block attribute, not content).
message BlockSetAlign {
  string     block_id = 1;
  BlockAlign align    = 2;
}

// Set a block's background color ("" clears it).
message BlockSetBackground {
  string block_id = 1;
  string color    = 2;
}

// Initialize an object with a type key. Must be the first op
// in the genesis change (the change with no parents).
message ObjectCreate {
  string type_key = 1;
}

// Tombstone. The object is logically deleted. Ops after this
// still apply (soft delete is a flag, not a barrier).
message ObjectDelete {}

// Set a named field to a typed value.
message FieldSet {
  string key   = 1;
  Value  value = 2;
}

// Remove a named field.
message FieldDelete {
  string key = 1;
}

// Where a block lands relative to a target block. NONE preserves the
// legacy parent_id/after_id addressing (append semantics). LEFT/RIGHT
// trigger deterministic row/column creation during replay (see
// src/dag/blocks.ts moveFromSide).
enum Position {
  POSITION_NONE = 0;   // legacy: use parent_id/after_id
  TOP           = 1;   // above target, same parent
  BOTTOM        = 2;   // below target, same parent
  LEFT          = 3;   // new/existing column to the left of target
  RIGHT         = 4;   // new/existing column to the right of target
  INNER         = 5;   // inside target, as last child
  REPLACE       = 6;   // replace target (children may be inherited)
  INNER_FIRST   = 7;   // inside target, as first child
}

// Insert a block into the block tree.
// New writers set target_id + position; parent_id/after_id remain for
// decoding pre-position history (replayed as root appends).
message BlockAdd {
  string   parent_id = 1;   // legacy: parent block id ("" = root level)
  string   after_id  = 2;   // legacy: insert after this sibling ("" = first)
  Block    block     = 3;
  string   target_id = 4;   // block the position is relative to ("" = root)
  Position position  = 5;
}

// Remove a block and its descendants.
message BlockRemove {
  string block_id = 1;
}

// Replace a block's content.
message BlockUpdate {
  string       block_id = 1;
  BlockContent content  = 2;
}

// Move a block (and its subtree) to a new position.
message BlockMove {
  string   block_id      = 1;
  string   new_parent_id = 2;  // legacy addressing
  string   after_id      = 3;  // legacy addressing
  string   target_id     = 4;
  Position position      = 5;
}


// ── Layer 2: Sync Protocol ───────────────────────────────────────
//
// Typed messages for DAG exchange between peers. Pull-based:
// a peer advertises its heads, the other responds with what's
// missing. Every message is an Envelope with a typed payload.
//
// The transport is Rivet actor actions over HTTP. Each object
// actor is a sync peer — globally addressable, durable,
// wakes on demand.

message Envelope {
  string from_id   = 1;    // sender actor/object id
  string to_id     = 2;    // recipient actor/object id
  int64  timestamp = 3;

  oneof message {
    // Sync: DAG exchange
    HeadAdvertise   head_advertise   = 10;
    HeadRequest     head_request     = 11;
    ChangePush      change_push      = 12;
    ChangeRequest   change_request   = 13;

    // Subscriptions: live updates
    ObjectSubscribe object_subscribe = 20;
    ObjectEvent     object_event     = 21;

    // Application: free-form IPC between objects
    AppMessage      app_message      = 30;
  }
}

// "Here are my heads for this object."
// Sent on connection or periodically. Receiver compares against
// its own heads to determine what's missing on either side.
message HeadAdvertise {
  string object_id       = 1;
  repeated bytes head_ids = 2;  // content-addressed change ids
}

// "Send me changes between these known ancestors and these heads."
// Response is a ChangePush.
message HeadRequest {
  string object_id        = 1;
  repeated bytes known_ids  = 2;  // changes I already have
  repeated bytes target_ids = 3;  // heads I want to reach
}

// "Here are changes you're missing."
// Changes are topologically sorted — the receiver can apply them
// incrementally without needing the full DAG upfront.
message ChangePush {
  string object_id       = 1;
  repeated Change changes = 2;  // topologically sorted
}

// "Send me these specific changes by hash."
// Fallback when HeadRequest can't express the need.
message ChangeRequest {
  string object_id         = 1;
  repeated bytes change_ids = 2;
}

// "Notify me when this object changes."
message ObjectSubscribe {
  string object_id = 1;
}

// "This object changed."
message ObjectEvent {
  string object_id           = 1;
  repeated bytes new_head_ids = 2;
  repeated Change changes     = 3;  // inline, saves a round-trip
}

// Free-form application message. The old Envelope behavior
// for non-sync IPC between objects.
message AppMessage {
  string action  = 1;
  bytes  payload = 2;
}


// ── Layer 3: Computed State ──────────────────────────────────────
//
// Derived by replaying the DAG. Never the source of truth.
// ObjectSnapshot can be embedded in a Change as a checkpoint
// to speed up replay (skip everything before the snapshot).

message ObjectSnapshot {
  string id       = 1;
  string type_key = 2;
  map<string, Value> fields = 3;
  // Deprecated: content moved to primary block
  bytes content = 4;
  repeated Block blocks = 5;
  bool   deleted    = 6;
  int64  created_at = 7;
  int64  updated_at = 8;
}

// Lightweight reference for listings. No content, no fields.
message ObjectRef {
  string id        = 1;
  string type_key  = 2;
  int64  created_at = 3;
  int64  updated_at = 4;
}


// ── Blocks ───────────────────────────────────────────────────────
//
// Objects contain a tree of blocks. A page's blocks are paragraphs,
// headings, lists. A database's blocks are records. Composable.

message Block {
  string id = 1;
  repeated string children_ids = 2;
  BlockContent content = 3;
  ValueMap fields = 4;            // per-block config, e.g. fields["width"] on columns
  BlockAlign align = 5;
  string background_color = 6;
}

enum BlockAlign {
  ALIGN_LEFT    = 0;
  ALIGN_CENTER  = 1;
  ALIGN_RIGHT   = 2;
  ALIGN_JUSTIFY = 3;
}

message BlockContent {
  oneof content {
    TextContent   text   = 1;
    CustomContent custom = 2;
    LayoutContent layout = 3;
  }
}

// Structural block with no visual content of its own — it only shapes
// children_ids. ROW/COLUMN pairs are created and destroyed automatically
// by LEFT/RIGHT block placement + the normalize pass, never by hand.
message LayoutContent {
  LayoutStyle style = 1;
}

enum LayoutStyle {
  ROW    = 0;
  COLUMN = 1;
  DIV    = 2;
  HEADER = 3;
}

// Program-defined block content. The OS stores, syncs, and
// content-addresses it without interpreting the payload.
// Programs encode their domain-specific block data into `data`
// and declare the type via `content_type`. The `meta` map lets
// the OS display a fallback (title, description) for blocks
// whose type it doesn't understand.
message CustomContent {
  string content_type          = 1;  // e.g. "image", "table", "embed"
  bytes  data                  = 2;  // program-encoded payload
  map<string, string> meta     = 3;  // fallback display metadata
}

message TextContent {
  string    text  = 1;
  TextStyle style = 2;
  repeated Mark marks = 3;   // ranged inline formatting
  bool      checked = 4;     // CHECKBOX / TOGGLE state
  string    color = 5;       // whole-block text color
}

// Inline formatting over a character range [from, to) of TextContent.text.
// param carries the mark's payload: url for LINK, color name for
// TEXT_COLOR/BACKGROUND_COLOR, object id for MENTION/OBJECT.
message Mark {
  int32    from  = 1;
  int32    to    = 2;
  MarkType type  = 3;
  string   param = 4;
}

enum MarkType {
  BOLD             = 0;
  ITALIC           = 1;
  STRIKETHROUGH    = 2;
  UNDERLINE        = 3;
  INLINE_CODE      = 4;
  LINK             = 5;
  TEXT_COLOR       = 6;
  BACKGROUND_COLOR = 7;
  MENTION          = 8;
  OBJECT_MARK      = 9;
}

enum TextStyle {
  PARAGRAPH   = 0;
  HEADER1     = 1;
  HEADER2     = 2;
  HEADER3     = 3;
  QUOTE       = 4;
  CODE        = 5;
  BULLET      = 6;
  NUMBERED    = 7;
  CHECKBOX    = 8;
  TITLE       = 9;
  TOGGLE      = 10;
  CALLOUT     = 11;
  DESCRIPTION = 12;
}


// ── Values ───────────────────────────────────────────────────────
//
// Typed values for fields. The oneof enforces type safety at the
// protobuf level — no stringly-typed maps.
//
// Value is recursive: ValueMap and ValueList contain Values,
// so programs can express arbitrarily nested structures without
// modifying glon.proto. A browser stores cookie jars as nested
// maps. A spreadsheet stores cell metadata as typed lists.
// Glon carries it all through the same Change DAG.

message Value {
  oneof kind {
    string     string_value  = 1;
    int64      int_value     = 2;
    double     float_value   = 3;
    bool       bool_value    = 4;
    bytes      bytes_value   = 5;
    StringList list_value    = 6;
    ValueMap   map_value     = 7;   // nested key-value
    ValueList  values_value  = 8;   // heterogeneous typed list
    ObjectLink link_value    = 9;   // typed link to another object
  }
}

// A typed link from this object to another.
// Links are field values — they participate in FieldSet/FieldDelete like any
// other Value kind. A Task's "assignee" field is a link to a Person object.
// Links in a ValueList express one-to-many (a Project's "tasks" field).
message ObjectLink {
  string target_id    = 1;  // the linked object's UUID
  string relation_key = 2;  // e.g. "assignee", "parent", "blocks"
}

message StringList {
  repeated string values = 1;
}

// Recursive map: string keys to typed Values.
message ValueMap {
  map<string, Value> entries = 1;
}

// Recursive list: ordered sequence of typed Values.
message ValueList {
  repeated Value items = 1;
}


// ── Transport Layer ──────────────────────────────────────────────
//
// Transport-agnostic envelope for moving opaque bytes between
// Glon instances. Transports carry Envelope bytes; the router
// dispatches by content_type. No gossip, no consensus — just
// signed payloads moved over whatever pipe is available.

message TransportEnvelope {
  string content_type = 1;        // e.g. "glon/change-bundle", "glon/text"
  bytes payload = 2;              // content-type-specific bytes
  bytes sender_pubkey = 3;        // optional convenience for receiver lookup
  map<string, string> metadata = 4;
}

// A bundle of Changes for import. No id, no hash — the Changes
// inside are individually content-addressed. The bundle is a
// transient wrapper that ceases to exist after dispatch.
message ChangeBundle {
  repeated bytes changes = 1;     // each is a serialized Change proto
}

// A lightweight text message for agent-to-agent chat.
// Carried in TransportEnvelope with content_type="glon/text".
message TextMessage {
  string text = 1;
}

// ── Descriptors: things describing themselves ────────────────────────
//
// A client should be able to open a vault it has never seen and know how to
// work it, without a table of hard-coded knowledge compiled in. A Descriptor
// is that printed menu card: what exists, what it needs, how to check it.
// An Installation is the answer for one machine: what is true right now.
//
// Descriptors travel as bytes inside an object (machine-authored, versioned,
// and protected by proto3's unknown-field preservation: a client older than
// the descriptor renders what it understands and passes the rest through
// untouched). Installations are ordinary object FIELDS instead, so `error`,
// `account` and `status` work with views, sorting and the existing badge.
//
// Secrets are structurally absent. FieldSpec.secret says a value exists for
// this on some machine; there is no field here that could carry the value.

enum DescriptorKind {
  DESCRIPTOR_KIND_UNSPECIFIED = 0;
  SKILL = 1;        // a tool on the wall: a command, a CLI, a capability
  INTEGRATION = 2;  // a key on a hook: an account or login
  AGENT = 3;        // a mind: model, tools, prompt sections
}

enum FieldFormat {
  FIELD_FORMAT_UNSPECIFIED = 0;
  TEXT = 1;
  PASSWORD = 2;
  URL = 3;
  EMAIL = 4;
}

enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;
  BROWSER_PROFILE = 1;  // a logged-in Chrome profile on that machine
  OAUTH = 2;            // a token in a local config dir
  API_KEY = 3;          // fields the human pasted
  NONE = 4;             // nothing to authenticate
}

enum InstallStatus {
  INSTALL_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;      // checked and working
  NEEDS_AUTH = 2;  // present but not authorised
  MISSING = 3;     // not installed here
  BROKEN = 4;      // installed, failing (see error)
}

// One input a human must supply. The form a client renders IS this list.
message FieldSpec {
  string key = 1;          // "apiSecret"
  string label = 2;        // "API secret"
  bool secret = 3;         // never leaves the machine
  FieldFormat format = 4;
  string note = 5;         // shown under the input
}

// How a machine proves the thing works. `command` is NOT executed because a
// descriptor said so - see docs/descriptors.md: anything executable needs
// explicit human consent per descriptor, and never runs on arrival.
message CheckSpec {
  string command = 1;         // "command -v browserless"
  string expect_contains = 2; // optional substring the output must hold
  int32 timeout_ms = 3;
}

// How a machine acquires it. Prompt-shaped on purpose: the installer is an
// agent following instructions, not a package manager.
message InstallSpec {
  string prompt = 1;
  string uninstall_prompt = 2;
  string docs_url = 3;
}

// What an agent of this kind is. Present only on kind == AGENT cards; the
// harness kinds catalog publishes one, and setup copies `requires` onto the
// agent object so `resolve_server` can hold it to the machine that has them.
message AgentSpec {
  string system = 1;                 // standing prompt
  string model = 2;                  // default model id
  repeated string requires = 3;      // descriptor keys the serving machine must have active
  repeated string skills = 4;        // skill keys surfaced to this kind (empty = all)
  repeated string responsible_types = 5;
}

message Descriptor {
  string key = 1;               // "x", "browserless", "google"
  string name = 2;              // "X (Twitter)"
  string description = 3;
  DescriptorKind kind = 4;
  repeated FieldSpec fields = 5;
  repeated AuthMethod auths = 6;
  CheckSpec check = 7;
  InstallSpec install = 8;
  string version = 9;           // descriptor version, author's own scheme
  string author = 10;           // who published it; unsigned by design
  AgentSpec agent = 11;         // present only for kind == AGENT
}

// What is true for one descriptor on one machine. Mirrored into object
// fields, so `error` lands on the bundled Error property.
message Installation {
  string key = 1;
  string machine_id = 2;
  InstallStatus status = 3;
  string account = 4;        // "@matcherino", "support@matcherino.com"
  AuthMethod auth = 5;       // which method it actually used
  int64 checked_at = 6;
  string error = 7;
}

// ── Conversations: many chats per object ─────────────────────────────
//
// An object holds MORE than one conversation: the human's chat about the
// object, and the agent-to-agent threads that ran alongside it. All of them
// live in this object's block tree, so one object's protobuf carries every
// conversation it has ever had - a client that reads the object reads the
// chats, with no side channel and no second fetch.
//
// Storage is deliberately the existing block machinery, not a new list:
//   - one ROOT block per conversation, custom content_type "discussion",
//     carrying a serialized Conversation in `custom.data`;
//   - one CHILD block per message, custom content_type "chat", with
//     meta{author, ts, text, replyTo, reactions} exactly as before.
//
// That buys three properties we already rely on: block adds merge cleanly
// across devices (two agents can post at once), replay is idempotent by
// block id, and there is no cap beyond the object itself - a message is one
// appended change, not a rewrite of a growing field.
//
// The legacy root id "__discussion__" IS the human conversation; vaults
// written before this message keep working and decode as kind HUMAN.

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  HUMAN = 1;         // the human's chat about this object
  AGENT_TO_AGENT = 2;// two or more agents working, alongside the human thread
  AGENT_PRIVATE = 3; // one agent's own reasoning transcript
}

message Conversation {
  string id = 1;                    // block id of this conversation's root
  ConversationKind kind = 2;
  string title = 3;                 // "Pricing review", "" = derive from kind
  repeated string participants = 4; // author ids: agents, devices, humans
  int64 created_at = 5;
  string opened_by = 6;             // author id that started it
  string about_message_id = 7;      // the message that spawned this thread
  bool closed = 8;                  // closed threads stay readable
}

// A message is immutable. Every involved object stores the same AgentMessage
// bytes under its own __thread__<exchange_id> discussion root. Delivery and
// processing receipts are ordinary metadata blocks nested below that message.
message AgentEndpoint {
  string object_id = 1;
  string agent_id = 2; // empty for human or installation endpoint
}

message AgentMessage {
  string id = 1;
  string exchange_id = 2;
  AgentEndpoint sender = 3;
  repeated AgentEndpoint recipients = 4; // immutable, distinct object snapshot
  string text = 5;
  string reply_to = 6;
  int64 sent_at = 7;
  string title = 8;
  bool request_reply = 9;
  bool historical = 10; // imported history never wakes or requests a response
  string operation = 11; // allowlisted intent only; never credentials/arguments
  string author = 12;
}
